<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relógio Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="relogio">
    <div>
      <span id="horas">00</span>
      <span class="tempo">h</span>
    </div>
    <div>
      <span id="minutos">00</span>
      <span class="tempo">m</span>
    </div>
    <div>
      <span id="segundos">00</span>
      <span class="tempo">s</span>
    </div>
  </div>

  <script>
    const relogio = () => {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, '0');
      const m = String(agora.getMinutes()).padStart(2, '0');
      const s = String(agora.getSeconds()).padStart(2, '0');
      document.getElementById('horas').textContent = h;
      document.getElementById('minutos').textContent = m;
      document.getElementById('segundos').textContent = s;
    };
    setInterval(relogio, 1000);
    relogio();
  </script>
</body>
</html>
